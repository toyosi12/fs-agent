[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "fs-agent"
version = "0.1.0"
description = "Multi-agent orchestrator that drafts full-stack JavaScript apps"
readme = "README.md"
authors = [{ name = "fs-agent" }]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "ruff>=0.5",
]

[project.scripts]
fs-agent = "fs_agent.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
